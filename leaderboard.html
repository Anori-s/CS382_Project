<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Leaderboard — Pac-Man</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      color: #eee;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 40px 16px 60px;
    }

   
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.07) 2px,
        rgba(0,0,0,0.07) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    h1 {
      font-size: clamp(18px, 4vw, 32px);
      color: #f7c948;
      text-shadow: 0 0 20px rgba(247,201,72,0.6), 4px 4px 0 #b8860b;
      letter-spacing: 4px;
      margin-bottom: 8px;
      animation: titlePulse 2s ease-in-out infinite;
    }

    @keyframes titlePulse {
      0%, 100% { text-shadow: 0 0 20px rgba(247,201,72,0.6), 4px 4px 0 #b8860b; }
      50%       { text-shadow: 0 0 40px rgba(247,201,72,1),   4px 4px 0 #b8860b; }
    }

    .subtitle {
      font-size: 9px;
      color: #3a3aff;
      letter-spacing: 3px;
      margin-bottom: 36px;
    }

    /* Ghost decorations */
    .ghosts {
      display: flex;
      gap: 24px;
      margin-bottom: 28px;
    }

    .ghost {
      width: 28px;
      height: 28px;
      border-radius: 14px 14px 0 0;
      position: relative;
      animation: ghostBob 1.2s ease-in-out infinite;
    }
    .ghost:nth-child(1) { background: #ff0000; animation-delay: 0s; }
    .ghost:nth-child(2) { background: #ffb8ff; animation-delay: 0.3s; }
    .ghost:nth-child(3) { background: #00ffff; animation-delay: 0.6s; }
    .ghost:nth-child(4) { background: #ffb852; animation-delay: 0.9s; }

    .ghost::before {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 100%;
      height: 8px;
      background: inherit;
      clip-path: polygon(0 0, 14% 100%, 29% 0, 43% 100%, 57% 0, 71% 100%, 86% 0, 100% 100%, 100% 0);
    }

    .ghost::after {
      content: '';
      position: absolute;
      top: 8px;
      left: 4px;
      width: 8px;
      height: 8px;
      background: white;
      border-radius: 50%;
      box-shadow: 12px 0 0 white;
    }

    @keyframes ghostBob {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }

    /* Table */
    .table-wrap {
      width: 100%;
      max-width: 560px;
      border: 2px solid #3a3aff;
      box-shadow: 0 0 24px rgba(58,58,255,0.4), inset 0 0 40px rgba(0,0,30,0.5);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 32px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead tr {
      background: #3a3aff;
    }

    thead th {
      padding: 12px 16px;
      font-size: 9px;
      letter-spacing: 2px;
      color: #fff;
      text-align: left;
    }

    thead th:first-child { text-align: center; width: 48px; }
    thead th:last-child  { text-align: right; }

    tbody tr {
      border-bottom: 1px solid #2a2a4a;
      transition: background 0.15s;
    }

    tbody tr:hover { background: rgba(58,58,255,0.15); }
    tbody tr:nth-child(odd)  { background: rgba(34,34,68,0.6); }
    tbody tr:nth-child(even) { background: rgba(20,20,50,0.4); }

    /* Gold #1 */
    tbody tr:nth-child(1) td { color: #f7c948; }
    tbody tr:nth-child(1) .rank-badge { background: #f7c948; color: #1a1a2e; }

    /* Silver #2 */
    tbody tr:nth-child(2) td { color: #c0c0c0; }
    tbody tr:nth-child(2) .rank-badge { background: #c0c0c0; color: #1a1a2e; }

    /* Bronze #3 */
    tbody tr:nth-child(3) td { color: #cd7f32; }
    tbody tr:nth-child(3) .rank-badge { background: #cd7f32; color: #1a1a2e; }

    tbody td {
      padding: 10px 16px;
      font-size: 9px;
    }

    tbody td:first-child { text-align: center; }
    tbody td:last-child  { text-align: right; color: #888; font-size: 8px; }

    .rank-badge {
      display: inline-block;
      width: 22px;
      height: 22px;
      line-height: 22px;
      text-align: center;
      border-radius: 3px;
      background: #2a2a4a;
      font-size: 8px;
    }

    /* Score value with dots */
    .score-val::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      background: currentColor;
      border-radius: 50%;
      margin-right: 8px;
      opacity: 0.6;
      vertical-align: middle;
    }

    /* State rows */
    .state-row td {
      text-align: center;
      padding: 32px;
      color: #555;
      font-size: 9px;
      letter-spacing: 2px;
    }

    .loading-dots span {
      animation: blink 1s step-end infinite;
      color: #3a3aff;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink { 50% { opacity: 0; } }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      background: #f7c948;
      color: #1a1a2e;
      border: none;
      padding: 14px 28px;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      cursor: pointer;
      border-radius: 4px;
      letter-spacing: 1px;
      transition: background 0.1s, transform 0.1s, box-shadow 0.1s;
      box-shadow: 0 4px 0 #b8860b;
    }

    button:hover {
      background: #ffd966;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #b8860b;
    }

    button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #b8860b;
    }

    button.secondary {
      background: transparent;
      color: #3a3aff;
      border: 2px solid #3a3aff;
      box-shadow: 0 4px 0 #1a1a88;
    }

    button.secondary:hover {
      background: rgba(58,58,255,0.1);
      box-shadow: 0 6px 0 #1a1a88;
    }

    button.secondary:active {
      box-shadow: 0 2px 0 #1a1a88;
    }

    .last-updated {
      margin-top: 20px;
      font-size: 7px;
      color: #444;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <h1>LEADERBOARD</h1>
  <p class="subtitle">TOP 10 PLAYERS</p>

  <div class="ghosts">
    <div class="ghost"></div>
    <div class="ghost"></div>
    <div class="ghost"></div>
    <div class="ghost"></div>
  </div>

  <div class="table-wrap">
    <table id="scores-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Score</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="scores-body">
        <!-- filled by JS -->
      </tbody>
    </table>
  </div>

  <div class="btn-row">
    <button onclick="location.href='index.html'">▶ PLAY NOW</button>
    <button class="secondary" onclick="location.href='index.html'">← BACK</button>
  </div>

  <p class="last-updated" id="last-updated"></p>

  <script>
    async function loadScores() {
      const body = document.getElementById('scores-body');

      // Show loading state
      body.innerHTML = `
        <tr class="state-row">
          <td colspan="4">
            LOADING
            <span class="loading-dots">
              <span>.</span><span>.</span><span>.</span>
            </span>
          </td>
        </tr>`;

      try {
        const res = await fetch('get_scores.php');
        if (!res.ok) throw new Error('Server error');
        const data = await res.json();

        body.innerHTML = '';

        if (!data.length) {
          body.innerHTML = `
            <tr class="state-row">
              <td colspan="4">NO SCORES YET — BE THE FIRST!</td>
            </tr>`;
          return;
        }

        data.forEach((row, i) => {
          const tr = document.createElement('tr');
          const date = new Date(row.created_at).toLocaleDateString('en-GB', {
            day: '2-digit', month: 'short', year: '2-digit'
          }).toUpperCase();

          // Escape player name to prevent XSS
          const safeName = row.player_name
            .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

          tr.innerHTML = `
            <td><span class="rank-badge">${i + 1}</span></td>
            <td>${safeName}</td>
            <td><span class="score-val">${Number(row.score).toLocaleString()}</span></td>
            <td>${date}</td>`;
          body.appendChild(tr);
        });

        document.getElementById('last-updated').textContent =
          'UPDATED ' + new Date().toLocaleTimeString();

      } catch (err) {
        body.innerHTML = `
          <tr class="state-row">
            <td colspan="4">FAILED TO LOAD SCORES</td>
          </tr>`;
        console.error('Leaderboard fetch error:', err);
      }
    }

    loadScores();
  </script>

</body>
</html>
