<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="start-screen">

<main class="start-card">
  <h1 class="game-title">REGISTER</h1>
  <p class="subtitle">Create account</p>

  <div class="input-group">
    <input type="text" id="reg-name" placeholder="Username">
  </div>

  <div class="input-group">
    <input type="email" id="reg-email" placeholder="Email">
  </div>

<div class="input-group">
  <input type="password" id="reg-password" placeholder="Password">
</div>

  <button id="register-btn" class="primary-btn">Register</button>
</main>

<script>
  document.getElementById("register-btn").addEventListener("click", async () => {
    const name = document.getElementById("reg-name").value.trim();
    const email = document.getElementById("reg-email").value.trim();
    const password = document.getElementById("reg-password").value.trim();

    if (!name || !email || !password) {
      alert("Please fill all fields!");
      return;
    }

    if (!email.includes("@") || !email.includes(".")) {
      alert("Please enter a valid email!");
      return;
    }

    //Send to PHP
    const res  = await fetch("register.php", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email, password })
    });
    const data = await res.json(); //get response

    if (data.success) {//if registration successful
      alert("Registration successful! Please login.");
      window.location.href = "index.html";//redirect to login
    } else {
      alert("Error: " + data.error);
    }
  });
</script>

</body>
</html>
