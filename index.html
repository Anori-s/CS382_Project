<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pac-Man</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="start-screen">
  <main class="start-card">
    <h1 class="game-title">PAC-MAN</h1>
<p class="subtitle">Login to start the game</p>
<!-- replace the existing input-group div with these two -->
<div class="input-group">
  <input type="text" id="player-name" placeholder="Username" maxlength="20">
</div>
<div class="input-group">
  <input type="password" id="player-password" placeholder="Password">
</div>

<!-- change the button label too -->
<button id="play-btn" class="primary-btn">Login & Play</button>

<a href="register.html" class="secondary-link">Register</a>
<a href="leaderboard.html" class="leaderboard-link">View Leaderboard</a>
  </main>

<script>
  document.getElementById("play-btn").addEventListener("click", async () => {
    const name     = document.getElementById("player-name").value.trim();
    const password = document.getElementById("player-password").value.trim();

    if (!name || !password) {
      alert("Please enter your username and password!");
      return;
    }

    const res  = await fetch("login.php", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, password })
    });
    const data = await res.json();

    if (data.success) {
      sessionStorage.setItem("playerName", name);
      sessionStorage.setItem("isLoggedIn", "true");
      window.location.href = "game.html";
    } else {
      alert("Wrong username or password!");
    }
  });
</script>
</body>
</html>
