<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pac-Man</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="start-screen">
  <main class="start-card">
    <h1 class="game-title">PAC-MAN</h1>
    <p class="subtitle">Enter your name and start the game</p>

    <div class="input-group">
    <input
  type="text"
  id="player-name"
  placeholder="Your name"
  maxlength="20"
  aria-label="Player name"
  required
/>
    </div>

   <button id="play-btn" class="primary-btn">Play as Guest</button>

<a href="register.html" class="secondary-link">Register</a>
<a href="leaderboard.html" class="leaderboard-link">View Leaderboard</a>
  </main>

 <script>
  document.getElementById("play-btn").addEventListener("click", () => {
    const name = document.getElementById("player-name").value.trim();

    const registeredName = sessionStorage.getItem("registeredName");
    const registeredEmail = sessionStorage.getItem("registeredEmail");

    if (!name) {
      alert("Please enter your name!");
      return;
    }

    if (!registeredName || name !== registeredName) {
      alert("This username is not registered. Please register first.");
      return;
    }

    sessionStorage.setItem("playerName", registeredName);
    sessionStorage.setItem("playerEmail", registeredEmail);
    sessionStorage.setItem("isLoggedIn", "true");

    window.location.href = "game.html";
  });
</script>
</body>
</html>
